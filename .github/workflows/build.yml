name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        python3 -c "
        p = 'V2rayNG/app/build.gradle.kts'
        with open(p, 'r') as f: content = f.read()
        content = content.replace('compileSdk = 37', 'compileSdk = 37\n    ndkVersion = \"29.0.14206865\"')
        with open(p, 'w') as f: f.write(content)
        "

    - name: Install Python Image Tools
      run: python3 -m pip install Pillow

    - name: Rebrand App (Name, PV Icons, Colors, Banks Bypass)
      run: |
        python3 -c "
        import os, glob
        from PIL import Image, ImageDraw

        # 1. Заменяем имя приложения во ВСЕХ языках
        for f in glob.glob('V2rayNG/app/src/main/res/values*/strings.xml'):
            with open(f, 'r', encoding='utf-8') as fp:
                c = fp.read()
            c = c.replace('>v2rayNG<', '>Phlux VPN<').replace('>v2ray<', '>Phlux VPN<')
            with open(f, 'w', encoding='utf-8') as fp:
                fp.write(c)

        # 2. Устанавливаем тёмный фон иконки #060814
        bg_xml = 'V2rayNG/app/src/main/res/values/ic_launcher_background.xml'
        if os.path.exists(bg_xml):
            with open(bg_xml, 'w', encoding='utf-8') as fp:
                fp.write('<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <color name=\"ic_launcher_background\">#060814</color>\n</resources>\n')

        # 3. Генерируем фирменные неоновые иконки PV
        def make_pv_icon(size):
            img = Image.new('RGBA', (size, size), (6, 8, 20, 255))
            draw = ImageDraw.Draw(img)
            s = size / 512.0
            
            p_poly = [
                (int(110*s), int(120*s)), (int(330*s), int(120*s)), (int(380*s), int(170*s)),
                (int(380*s), int(250*s)), (int(330*s), int(300*s)), (int(180*s), int(300*s)),
                (int(110*s), int(370*s)), (int(110*s), int(290*s)), (int(170*s), int(230*s)),
                (int(300*s), int(230*s)), (int(320*s), int(210*s)), (int(320*s), int(190*s)),
                (int(300*s), int(170*s)), (int(170*s), int(170*s)),
            ]
            draw.polygon(p_poly, fill=(0, 132, 255, 255))
            
            v_poly = [
                (int(210*s), int(300*s)), (int(300*s), int(410*s)), (int(400*s), int(240*s)),
                (int(445*s), int(240*s)), (int(300*s), int(460*s)), (int(165*s), int(300*s)),
            ]
            draw.polygon(v_poly, fill=(0, 240, 255, 255))
            return img

        sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
        for density, px in sizes.items():
            folder = f'V2rayNG/app/src/main/res/mipmap-{density}'
            if os.path.exists(folder):
                icon = make_pv_icon(px)
                icon.save(os.path.join(folder, 'ic_launcher.png'))
                icon.save(os.path.join(folder, 'ic_launcher_round.png'))
                icon.save(os.path.join(folder, 'ic_launcher_foreground.png'))

        web_icon = 'V2rayNG/app/src/main/ic_launcher-web.png'
        if os.path.exists(web_icon):
            make_pv_icon(512).save(web_icon)

        # 4. Вшиваем обход 70+ банков РФ и сервисов в настройки по умолчанию
        settings_file = 'V2rayNG/app/src/main/java/com/v2ray/ang/handler/SettingsManager.kt'
        if os.path.exists(settings_file):
            with open(settings_file, 'r', encoding='utf-8') as fp:
                sc = fp.read()
            
            apps_list = 'setOf(\"ru.sberbankmobile\", \"ru.sberbank.sbol\", \"com.idamob.tinkoff.android\", \"ru.vtb24.mobilebanking.android\", \"ru.alfabank.mobile.android\", \"ru.gazprombank.android.mobilebank.app\", \"ru.raiffeisennews\", \"ru.rshb.dbo.mobile\", \"ru.sovcombank.halva\", \"ru.mkb.mobile\", \"ru.rosbank.android\", \"ru.bcs.bank\", \"ru.pochta.bank\", \"ru.uralsib.mobile\", \"ru.otpbank.mobile\", \"ru.psbank.mobile\", \"ru.akbars.mobile\", \"ru.open.bank\", \"ru.homecredit.mybank\", \"ru.tcsbank.investing\", \"ru.nspk.sbpay\", \"ru.vtb.mobilebank\", \"ru.ozon.app.android\", \"com.wildberries.ru\", \"com.magnit.express\", \"ru.tander.magnit\", \"com.x5retailgroup.pyaterochka\", \"ru.perekrestok.app\", \"ru.lentaonline.android\", \"ru.aliexpress.buyer\", \"ru.dns_shop.android\", \"ru.mvideo.android\", \"ru.eldorado.android\", \"ru.citilink.android\", \"com.avito.android\", \"ru.yandex.market\", \"ru.detmir.dmbonus\", \"com.vkontakte.android\", \"ru.oneme.app\", \"com.icq.mobile\", \"ru.ok.android\", \"ru.mail.mailapp\", \"ru.yandex.searchplugin\", \"ru.yandex.taxi\", \"ru.yandex.yandexmaps\", \"ru.yandex.music\", \"ru.rutube.app\", \"ru.kinopoisk\", \"ru.gosuslugi.mobile\", \"ru.nalog.lk\", \"ru.mos.polis\", \"ru.sberbankmobile_alpha\", \"ru.mts.mymts\", \"ru.beeline.services\", \"ru.megafon.mlk\", \"ru.tele2.mytele2\", \"ru.rt.mlk\", \"ru.delivery.club\", \"ru.samokat.android\", \"ru.yandex.eda\", \"ru.dodopizza.app\", \"ru.kfc.mobile\", \"ru.burgerking.mobile\", \"ru.sportmaster.app\", \"ru.mvm.android\", \"ru.aptekaru.android\", \"ru.apteka.eapteka\", \"ru.rzd.pass\", \"ru.aeroflot.mobile\", \"ru.pochta.mobileapp\", \"ru.cdek.app\", \"ru.boxberry.app\")'
            
            inject_code = f'''
        if (MmkvManager.decodeSettingsStringSet(AppConfig.PREF_PER_APP_PROXY_SET).isNullOrEmpty()) {{
            MmkvManager.encodeSettings(AppConfig.PREF_PER_APP_PROXY, true)
            MmkvManager.encodeSettings(AppConfig.PREF_BYPASS_APPS, true)
            MmkvManager.encodeSettings(AppConfig.PREF_PER_APP_PROXY_SET, {apps_list})
        }}
'''
            sc = sc.replace('ensureDefaultValue(AppConfig.PREF_MODE, VPN)', 'ensureDefaultValue(AppConfig.PREF_MODE, VPN)\n' + inject_code)
            with open(settings_file, 'w', encoding='utf-8') as fp:
                fp.write(sc)

        print('Rebranding & Banks bypass configured!')
        "

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.11
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore android_keystore.jks -alias phlux -keyalg RSA -keysize 2048 -validity 10000 -storepass phluxvpn123 -keypass phluxvpn123 -dname "CN=PhluxVPN, OU=Phlux, O=Phlux, L=City, S=State, C=RU"

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assembleRelease -Pandroid.injected.signing.store.file=${{ github.workspace }}/android_keystore.jks -Pandroid.injected.signing.store.password=phluxvpn123 -Pandroid.injected.signing.key.alias=phlux -Pandroid.injected.signing.key.password=phluxvpn123

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v4
      with:
        name: PhluxVPN-arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v4
      with:
        name: PhluxVPN-universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk
